version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: udyog-sathi-backend:latest
    container_name: udyog_sathi_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PREFIX=/api/v1
      - CORS_ORIGINS=*
      - AI_PRIMARY_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: udyog-sathi-frontend:latest
    container_name: udyog_sathi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
