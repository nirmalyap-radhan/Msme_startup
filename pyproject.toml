[project]
name = "msme-startup"
version = "0.1.0"
description = "Udyog Sathi MSME Scheme Discovery Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "beautifulsoup4>=4.12.0",
    "rank-bm25>=0.2.2",
]

[tool.vercel]
entrypoint = "apps.api.main:app"
