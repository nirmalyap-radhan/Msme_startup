services:
  # Backend FastAPI Web Service (Free Tier)
  - type: web
    name: udyog-sathi-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false

  # Frontend Static Site on Render (Global Edge CDN)
  - type: web
    name: udyog-sathi-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://udyog-sathi-api.onrender.com/api/*
      - type: rewrite
        source: /health/*
        destination: https://udyog-sathi-api.onrender.com/health/*
      - type: rewrite
        source: /*
        destination: /index.html

