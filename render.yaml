services:
  - type: web
    name: udyog-sathi
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
